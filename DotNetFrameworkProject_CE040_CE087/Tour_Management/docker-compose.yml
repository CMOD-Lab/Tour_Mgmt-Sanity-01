version: "3.8"

services:
  tour-management:
    image: tour-management:latest
    build:
      context: ../..
      dockerfile: DotNetFrameworkProject_CE040_CE087/Tour_Management/Dockerfile
    ports:
      - "80:80"
    environment:
      - ASPNET_ENVIRONMENT=Production
      - DB_HOST=${DB_HOST:-}
      - DB_PORT=${DB_PORT:-1433}
      - DB_NAME=${DB_NAME:-}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
    volumes:
      - tour_logs:C:/inetpub/logs
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "powershell", "-Command",
             "try { $r = Invoke-WebRequest -Uri http://localhost/Health.aspx -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { exit 0 } else { exit 1 } } catch { exit 1 }"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s

volumes:
  tour_logs:

networks:
  app-network:
    driver: bridge
